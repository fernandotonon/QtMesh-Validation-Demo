name: QtMesh Cloud Upload

# Cloud ingest for marketing dashboards / badges.
# Requires repository secret QTMESH_CLOUD_TOKEN from https://qtmesh.dev
# Green badge path scans only ship-ready assets; intentional failures are
# uploaded separately and do not fail the workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "qtmesh.yml"
      - "configs/**"
      - ".github/workflows/qtmesh-cloud.yml"

jobs:
  cloud-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan good assets + upload (green badge)
        uses: fernandotonon/QtMeshEditor@v1
        with:
          command: scan
          input-file: assets/good
          options: --config configs/good-only.yml --report reports/cloud-good.json --strict-upload
        env:
          QTMESH_CLOUD_TOKEN: ${{ secrets.QTMESH_CLOUD_TOKEN }}

      - name: Scan mobile campaign + upload (intentional findings)
        uses: fernandotonon/QtMeshEditor@v1
        with:
          command: scan
          input-file: assets
          options: --config configs/mobile-campaign.yml --report reports/cloud-mobile.json
        env:
          QTMESH_CLOUD_TOKEN: ${{ secrets.QTMESH_CLOUD_TOKEN }}
        continue-on-error: true

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qtmesh-cloud-report
          path: reports/
